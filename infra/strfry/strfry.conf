##
## 1NKY strfry relay config
##
## Based on the upstream default strfry.conf (github.com/hoytech/strfry).
## Only the values that differ from upstream are called out in comments.
##
## Mounted read-only at /etc/strfry.conf. strfry's config search order is:
##   1. --config  2. $STRFRY_CONFIG  3. /etc/strfry.conf  4. ./strfry.conf
## so this file wins over the one baked into the image at /app/strfry.conf.
##
## NO-LOGS POSTURE (CLAUDE.md hard rule #1, handoff Part 6/8):
##   - relay.realIpHeader is "" so strfry never reads X-Forwarded-For / X-Real-IP
##     and therefore has no client IP to put anywhere, including plugin input.
##   - every relay.logging.* dump switch is false.
##   - relay.logging.invalidEvents is false (upstream default is true) — that
##     log line would otherwise emit rejection detail on every spam attempt.
##   - the write policy itself logs only "kind=<n> <accept|reject>" to stderr.
##

# LMDB database directory. Inside the container this is a named docker volume
# (strfry_db). WORKDIR is /app, so ./strfry-db/ == /app/strfry-db/.
db = "./strfry-db/"

dbParams {
    # Maximum number of threads/processes that can simultaneously have LMDB
    # transactions open (restart required)
    maxreaders = 256

    # Size of mmap() to use when loading LMDB. Sparse — does NOT correspond to
    # disk space used. 10TB default is fine on the 2GB droplet.
    mapsize = 10995116277760

    # Disables read-ahead when accessing the LMDB mapping. Reduces IO activity
    # when DB size is larger than RAM. Turn this on when the relay DB outgrows
    # the box's RAM (roughly: > 1GB of events on s-1vcpu-2gb).
    noReadAhead = false
}

events {
    # 64KB hard cap on normalised event JSON. This is the number the write
    # policy also enforces (MAX_EVENT_BYTES) so client-facing rejection
    # messages are consistent. Flicks carry a URL + imeta tag, never bytes.
    maxEventSize = 65536

    # Events newer than this will be rejected. Bounds clock-skew abuse and
    # keeps PoW mining honest (you cannot pre-mine far into the future).
    rejectEventsNewerThanSeconds = 900

    # Events older than this will be rejected (~3 years).
    rejectEventsOlderThanSeconds = 94608000

    # Ephemeral events older than this will be rejected
    rejectEphemeralEventsOlderThanSeconds = 60

    # Ephemeral events are deleted from the DB when older than this
    ephemeralEventsLifetimeSeconds = 300

    # Maximum number of tags allowed
    maxNumTags = 2000

    # Maximum size for tag values, in bytes
    maxTagValSize = 1024
}

relay {
    # 0.0.0.0 == all interfaces INSIDE the container namespace only. The
    # container's published port is bound to 127.0.0.1 on the host by
    # docker-compose.yml, and in production nothing but caddy can reach it.
    # (restart required)
    bind = "0.0.0.0"

    # Port to open for the nostr websocket protocol (restart required)
    port = 7777

    # Set OS-limit on maximum number of open files/sockets
    nofiles = 524288

    # NO-LOGS: must stay empty. Setting this would make strfry parse and carry
    # the real client IP through the ingester and into write-policy input.
    # We do not want to possess that value, even transiently.
    realIpHeader = ""

    auth {
        # NIP-42 AUTH is off: 1NKY has no server-side account concept, and every
        # write is already a signed event gated by the write policy. Turning it
        # on would only add a challenge round-trip.
        enabled = false

        # External relay URL (beginning with wss://). Only needed when auth is on.
        serviceUrl = ""
    }

    info {
        # NIP-11 metadata. Shown in the relay's HTTP landing page too.
        name = "1nky"
        description = "Private relay for 1nky.com. Registration-free. No logs, no IPs, no accounts. Writes are PoW-gated and kind-restricted."
        # Administrative nostr pubkey (npub or 32-byte hex). Set to the site key
        # in production — the key that signs board registries and mod lists only.
        pubkey = ""
        self = ""
        # Deliberately no email contact: there is no email anywhere in this
        # product and that is a feature. Point at the web contact page instead.
        contact = "https://1nky.com/contact"
        icon = ""
        banner = ""
        privacy = "https://1nky.com/privacy"
        terms = "https://1nky.com/terms"
        # Supported NIPs advertised to clients. 1 (basic), 9 (deletes / "buff"),
        # 11 (this doc), 13 (PoW), 22 (kind-1111 comments), 40 (expiration /
        # "beef"), 45 (COUNT), 50 (search), 70 (protected), 77 (negentropy).
        nips = "[1,9,11,13,22,40,45,70,77]"
    }

    # Maximum accepted incoming websocket frame size. Must be larger than
    # events.maxEventSize; 2x gives headroom for the ["EVENT", {...}] envelope
    # and any permessage-deflate framing. (restart required)
    maxWebsocketPayloadSize = 131072

    # Maximum number of filters allowed in a REQ
    maxReqFilterSize = 200

    # Websocket-level PING frequency. Must be below caddy's proxy idle timeout.
    autoPingSeconds = 55

    # Detect dropped connections to the upstream reverse proxy.
    enableTcpKeepalive = true

    # How much uninterrupted CPU time a REQ query gets during its DB scan
    queryTimesliceBudgetMicroseconds = 10000

    # Maximum records returned per filter
    maxFilterLimit = 500

    # Maximum number of tag filters allowed per filter. Raised from the upstream
    # default of 3: board feeds filter on `t` (city) + `k` + `e` at once.
    maxTagsPerFilter = 5

    # Maximum records countable by a COUNT request (0 disables COUNT)
    maxFilterLimitCount = 1000000

    # Maximum concurrent REQs per connection
    maxSubsPerConnection = 200

    # Per-connection cap on unsent outbound bytes buffered in the websocket
    # library (0 = unlimited). Bounds memory used by slow/stalled clients.
    maxPendingOutboundBytes = 33554432

    writePolicy {
        # Event-sifter plugin. strfry spawns this as a stdio child process of
        # the relay — it is NOT a separate compose service. It inherits the
        # strfry container's environment, which is where POW_BITS_*,
        # ALLOWED_KINDS, MAX_EVENT_BYTES and BAN_LIST_PATH come from.
        #
        # The command contains spaces, so strfry treats it as a shell command
        # rather than a script path. That means strfry will NOT auto-reload the
        # plugin when the file's mtime changes — but the plugin hot-reloads its
        # own ban list from BAN_LIST_PATH, which is the part that has to change
        # at runtime. To pick up plugin CODE changes: restart the container.
        plugin = "node /app/plugin/write-policy.mjs"

        # Seconds to wait for a plugin response before failing the write.
        # Generous because PoW verification is cheap but ban-list reload does a
        # stat() + occasional read.
        timeoutSeconds = 10
    }

    compression {
        # permessage-deflate. Real bandwidth win on JSON events. (restart required)
        enabled = true
        slidingWindow = true
    }

    logging {
        # NO-LOGS. All of these are off, and the last one differs from upstream.
        dumpInAll = false
        dumpInEvents = false
        dumpInReqs = false
        dbScanPerf = false
        # Upstream default is true. It logs a line per rejected event; on a
        # PoW-gated public relay that is a firehose of spam telemetry we have
        # no use for and no wish to retain.
        invalidEvents = false
    }

    numThreads {
        # Sized for s-1vcpu-2gb (see infra/deploy/provision.sh). Bump ingester
        # and reqWorker first if you move to a bigger droplet.
        ingester = 2
        reqWorker = 2
        reqMonitor = 2
        negentropy = 1
    }

    negentropy {
        # Set reconciliation. Cheap, and it is how the indexer can efficiently
        # re-sync the Postgres cache after a rebuild without a full scan.
        enabled = true
        maxSyncEvents = 1000000
    }

    filterValidation {
        # Off. Our client issues multi-kind feed filters (kinds 1 + 20 + 1111
        # in one REQ) that strict validation would reject.
        enabled = false
        maxFiltersPerReq = 3
        minFiltersPerReq = 1
        maxKindsPerFilter = 3
        allowedKinds = ""
        requireAuthorOrTag = false
    }
}

##
## NIP-40 EXPIRATION (the "beef" thread lifetime feature)
##
## There is deliberately no config key here for it: expiration handling is
## unconditional in strfry and cannot be switched off.
##
##   - src/events.cpp parses the `expiration` tag at ingest and rejects any
##     event whose expiration is already in the past ("event expired").
##   - src/apps/relay/RelayCron.cpp runs every 9 seconds over the
##     Event__expiration LMDB index and hard-deletes everything past its
##     timestamp (alongside ephemeral events older than
##     events.ephemeralEventsLifetimeSeconds above).
##
## So a 24h/72h/7d beef thread is purged from the relay by the relay itself,
## with no cron job of ours. The Phase 2 acceptance criterion ("expired thread
## gone from relay and index") therefore tests strfry's cron on the relay side
## and the indexer's deletion handling on the Postgres side.
##
## ONE GOTCHA WHEN YOU TEST THIS BY HAND. RelayCron skips the single most
## recently inserted event:
##
##     if (levId == mostRecent) return true; // don't delete because it could
##                                           // cause levId re-use
##
## So on an idle relay, publishing one expiring event and waiting will NOT
## purge it — it is the newest event, so the guard protects it forever. Publish
## anything afterwards and it is swept on the next 9-second tick. Verified
## against strfry 1.1.0. This never matters in production (there is always a
## newer event), but it will absolutely convince you expiration is broken while
## you are testing on a quiet local relay.
##
## The one thing we must NOT do is set events.maxNumTags or maxTagValSize low
## enough to drop the expiration tag. Both are at upstream defaults.
##
