# ---------------------------------------------------------------------------
# 1NKY — local + single-host production compose
# ---------------------------------------------------------------------------
#
# NO-LOGS POLICY (hard rule #1 in CLAUDE.md, Part 6 + Part 8 of the handoff).
# Read this before adding a service or an env var.
#
#   * No service in this file enables request/access logging.
#     - caddy      : infra/caddy/Caddyfile contains ZERO `log` blocks. Caddy 2
#                    does not write access logs unless a `log` directive exists,
#                    so the absence IS the configuration. Do not add one.
#     - strfry     : relay.logging.dumpInAll / dumpInEvents / dumpInReqs and
#                    invalidEvents are all false, and relay.realIpHeader is ""
#                    so strfry never even parses a forwarded client IP.
#     - writepolicy: infra/strfry/write-policy.mjs prints EXACTLY
#                    "kind=<n> <accept|reject>" to stderr. No pubkeys, no event
#                    ids, no IPs, no sourceInfo. Ever.
#     - api/media  : Express 5 with no morgan / no access-log middleware.
#     - postgres   : no IP columns exist anywhere in the schema by design.
#     - tor        : `Log notice stderr` + `SafeLogging 1` in infra/tor/torrc.
#                    A hidden service never learns a client address; the
#                    per-circuit detail lives at `info`, which torrc forbids.
#                    Caveat, stated honestly: tor's own warnings can name a Tor
#                    directory authority or relay by IP. Public infrastructure,
#                    never a visitor. infra/README.md covers the audit grep.
#     - backup     : accepts no connections, so it cannot log a request. Its
#                    script prints object names and byte counts, and filters its
#                    own output for IP-shaped strings as defence in depth.
#
#   * We deliberately do NOT set `logging: { driver: "none" }`. That would also
#     suppress crash traces and startup errors, which we need to operate the
#     box. The docker default json-file driver is kept, and it only ever
#     receives what the processes above choose to emit — which is not requests.
#
#   * If you add a service: prove it does not log connection info before you
#     merge it. "We can turn it off later" is how this rule dies.
#
# ---------------------------------------------------------------------------
# PROFILES
#
#   Phase 0 acceptance (default profile, no flag needed):
#       docker compose up -d postgres strfry caddy
#
#   Whole stack (once apps/api, apps/indexer, apps/media exist):
#       docker compose --profile full up -d --build
#
# Configuration comes from infra/.env (Compose auto-loads the .env next to this
# file). Bootstrap it with:  cp ../.env.example .env
# Every value below has a sane default so the Phase 0 three-service bring-up
# works with no .env at all.
#
# VIDEO (media service): short graffiti clips are transcoded through ffmpeg
# with every metadata field stripped (GPS/device). Hard caps are enforced
# server-side: input <= MAX_VIDEO_MB (default 50) and <= 60s; output is
# H.264 720p. The original bytes are never persisted — only the transcoded
# mp4 and a poster still are stored, content-addressed by their sha256.
# ffmpeg is installed in infra/docker/media.Dockerfile (runtime stage).
# ---------------------------------------------------------------------------

name: 1nky

services:
  # -------------------------------------------------------------------------
  # Postgres — rebuildable index/cache. The relay is the source of truth.
  # There is no IP column in this database and there never will be.
  # -------------------------------------------------------------------------
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: oneinky
      POSTGRES_PASSWORD: oneinky
      POSTGRES_DB: oneinky
      # Deterministic initdb so `docker compose down -v && up` is reproducible.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Loopback only. Never 0.0.0.0 — this port has no business on the internet.
      # Host port is overridable: many dev boxes already have a postgres on 5432.
      # Set POSTGRES_HOST_PORT=5433 in infra/.env if this collides.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oneinky -d oneinky"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks: [oneinky]

  # -------------------------------------------------------------------------
  # strfry — the relay, and the source of truth for all events.
  #
  # The write policy is NOT a separate service: strfry spawns it as a stdio
  # child process (see relay.writePolicy.plugin in strfry/strfry.conf). The
  # plugin script and its ban list are bind-mounted at /app/plugin, and the
  # plugin inherits this service's environment.
  #
  # We build a thin image on top of the official ghcr.io/hoytech/strfry:latest
  # because that image is Alpine + the strfry binary only — it ships no Node
  # runtime, and our write policy is a Node script. See docker/strfry.Dockerfile.
  # -------------------------------------------------------------------------
  strfry:
    build:
      context: ./docker
      dockerfile: strfry.Dockerfile
    image: 1nky/strfry:local
    restart: unless-stopped
    # NO-LOGS, and this line is load-bearing.
    #
    # At the default INFO verbosity strfry emits, per connection:
    #     [1] Connect from 172.19.0.1 compression=Y sliding=Y
    #     [1] Disconnect from 172.19.0.1 (0/-) UP: 1.31K ...
    # That is an IP address in a log line, which hard rule #1 forbids outright.
    # Behind Caddy it would only ever be the proxy's bridge address rather than
    # a real visitor, but the rule does not have an "it's only a little bit of
    # connection info" clause, and anyone who later publishes this port
    # directly would start recording real client IPs with no warning.
    #
    # WARNING drops every INFO line — the connect/disconnect pairs, "HTTP
    # request for [/]", and the per-event "Inserted event id=..." chatter —
    # while keeping warnings and errors, which is what you actually need to
    # operate the relay. The write policy's own "kind=<n> accept|reject" goes
    # to the plugin's stderr and is unaffected by this, so the one signal we DO
    # want survives.
    #
    # It must be WARNING, not WARN. `strfry --help` advertises "WARN" and the
    # argument parser rejects it — the accepted set is INFO / WARNING / ERROR /
    # OFF or an integer, and a bad value is a fatal startup crash loop, not a
    # warning. Verified against strfry 1.1.0.
    command: ["--verbosity=${STRFRY_VERBOSITY:-WARNING}", "relay"]
    environment:
      # --- write-policy knobs (all read by strfry/write-policy.mjs) ---
      # Kind allowlist: 0 profile, 1 thread OP, 5 delete/"buff", 20 flick,
      # 22 short-form video/"flick" (NIP-71), 1059 NIP-59 gift wrap (private
      # messages), 1111 NIP-22 reply, 1984 report/"flag it", 10000 NIP-51 mute,
      # 30078 app-specific (board registry / mod list, signed by the site key).
      #
      # Kinds 13 (seal) and 14 (private message) are deliberately absent and
      # cannot be added back here: write-policy.mjs rejects them by number
      # before it looks at this list. They only ever exist encrypted inside a
      # 1059, so one arriving at the relay is a plaintext DM leak.
      ALLOWED_KINDS: "${ALLOWED_KINDS:-0,1,5,20,22,1059,1111,1113,1984,10000,30078}"
      MAX_EVENT_BYTES: "${MAX_EVENT_BYTES:-65536}"
      # NIP-13 tiers. Defaults mirror the root .env.example.
      POW_BITS_NEW: "${POW_BITS_NEW:-18}"
      POW_BITS_POST: "${POW_BITS_POST:-13}"
      POW_BITS_REACTION: "${POW_BITS_REACTION:-8}"
      # Which kinds fall into which PoW tier. 1059 sits in the reaction tier
      # because every gift wrap is signed by a fresh throwaway key — the
      # "first event from this pubkey" rule would charge POW_BITS_NEW for
      # every single private message.
      POW_NEW_KINDS: "${POW_NEW_KINDS:-0}"
      POW_REACTION_KINDS: "${POW_REACTION_KINDS:-1059,1984,10000}"
      # Hot-reloaded ban list (JSON array of 32-byte hex pubkeys). Lives on the
      # shared `modlists` volume the indexer writes — a bind mount of ./strfry
      # is root-owned after every deploy and the indexer (USER node) EACCESes.
      BAN_LIST_PATH: "${BAN_LIST_PATH:-/app/dynamic/banlist.json}"
      # Hot-reloaded invited list — invited pubkeys skip the newcomer PoW tier.
      INVITED_LIST_PATH: "${INVITED_LIST_PATH:-/app/dynamic/invited.json}"
      # Set to "0" to disable the PoW gate entirely (local dev only).
      POW_ENABLED: "${POW_ENABLED:-1}"
    volumes:
      - strfry_db:/app/strfry-db
      # Config is picked up from /etc/strfry.conf (strfry's search order puts it
      # ahead of the ./strfry.conf baked into the image).
      - ./strfry/strfry.conf:/etc/strfry.conf:ro
      # Mount the DIRECTORY, not the individual files: editors that replace the
      # inode on save (which is most of them) would otherwise never be visible
      # inside the container, and the ban list hot-reload would silently stop
      # working.
      - ./strfry:/app/plugin:ro
      # Dynamic mod lists (ban/invited), written by the indexer, read here.
      - modlists:/app/dynamic:ro
    ports:
      # Exposed to the compose network as strfry:7777 for caddy/indexer, and to
      # the host on loopback only so the Phase 0 smoke script can reach it.
      - "127.0.0.1:${RELAY_HOST_PORT:-7777}:7777"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('net').connect(7777,'127.0.0.1').on('connect',function(){process.exit(0)}).on('error',function(){process.exit(1)})"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks: [oneinky]

  # -------------------------------------------------------------------------
  # Caddy — TLS terminator and the only thing bound to public ports.
  # Logging is off (no `log` blocks in the Caddyfile) and `-Server` is stripped.
  # -------------------------------------------------------------------------
  caddy:
    image: caddy:2.8
    restart: unless-stopped
    depends_on:
      strfry:
        condition: service_healthy
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      # apps/web's built dist/ (index.html + assets/), served at :8080's root
      # for the .onion mirror and, once 1nky.com's block above is uncommented,
      # the clearnet vhost too — same dist/ either way, since config.ts derives
      # API/media/relay bases from the .onion host at runtime instead of
      # baking clearnet URLs in. A plain relative bind mount, not a named
      # volume: infra/deploy/deploy.sh populates ./web-dist by rsyncing
      # apps/web/dist/ here as part of every deploy, before this container is
      # recreated, and a bind mount is what lets the deploy step overwrite it
      # without going through docker at all. `:ro` — nothing in the container
      # ever needs to write into it. Empty ./web-dist (e.g. first bring-up
      # before a deploy has shipped anything) just means file_server 404s;
      # see the Caddyfile's :8080 root handle comment.
      - ./web-dist:/srv/web:ro
    ports:
      # Overridable for dev boxes where something already owns 80/443.
      # Leave them at the defaults in production — ACME needs 80 and 443.
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [oneinky]

  # -------------------------------------------------------------------------
  # Application services. Profile `full` — they are not part of the Phase 0
  # acceptance bring-up and it is fine for apps/* to not exist yet.
  # -------------------------------------------------------------------------

  # Read-only REST API (@1nky/api). Writes NEVER go through here — writes are
  # signed events to the relay.
  api:
    profiles: ["full"]
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
      args:
        # Flip to --no-frozen-lockfile before pnpm-lock.yaml is committed.
        PNPM_INSTALL_FLAGS: "${PNPM_INSTALL_FLAGS:---frozen-lockfile}"
    image: 1nky/api:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: "${NODE_ENV:-production}"
      API_PORT: "3001"
      DATABASE_URL: "${DATABASE_URL:-postgres://oneinky:oneinky@postgres:5432/oneinky}"
      RELAY_WS_URL: "${RELAY_WS_URL:-ws://strfry:7777}"
      MEDIA_PUBLIC_BASE: "${MEDIA_PUBLIC_BASE:-http://localhost/media}"
      SITE_MOD_PUBKEYS: "${SITE_MOD_PUBKEYS:-}"
      SITE_PUBKEY: "${SITE_PUBKEY:-}"
      # Shared secret for /mod/*. Unset leaves the mod queue endpoints disabled
      # (the api says so once on startup) rather than open.
      MOD_API_KEY: "${MOD_API_KEY:-}"
    expose:
      - "3001"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/healthz').then(function(r){process.exit(r.ok?0:1)}).catch(function(){process.exit(1)})"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [oneinky]

  # Firehose consumer (@1nky/indexer). No listening port by design.
  #
  # It is also the writer of the relay's ban list. A moderator signs a kind-30078
  # ban, the indexer applies it to `banned_pubkeys` and re-exports
  # /strfry-plugin/banlist.json, which is infra/strfry/ mounted READ-WRITE here.
  # The strfry service mounts the same host directory read-only at /app/plugin,
  # so the write policy sees the new file and hot-reloads it within ~1s. Only
  # this service may write it; the relay only ever reads it.
  indexer:
    profiles: ["full"]
    build:
      context: ..
      dockerfile: infra/docker/indexer.Dockerfile
      args:
        PNPM_INSTALL_FLAGS: "${PNPM_INSTALL_FLAGS:---frozen-lockfile}"
    image: 1nky/indexer:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      strfry:
        condition: service_healthy
    environment:
      NODE_ENV: "${NODE_ENV:-production}"
      DATABASE_URL: "${DATABASE_URL:-postgres://oneinky:oneinky@postgres:5432/oneinky}"
      RELAY_WS_URL: "${RELAY_WS_URL:-ws://strfry:7777}"
      NEWBIE_POSTS_PER_DAY: "${NEWBIE_POSTS_PER_DAY:-5}"
      NEWBIE_WINDOW_HOURS: "${NEWBIE_WINDOW_HOURS:-48}"
      # Without this, any signer can define boards via kind-30078.
      SITE_PUBKEY: "${SITE_PUBKEY:-}"
      # Moderators. Two powers hang off this list and nothing else does: a
      # kind-30078 ban/unban is applied to `banned_pubkeys` only from one of
      # these signers, and a kind-5 from one of them is a takedown that reaches
      # another writer's event. Unset means nobody is a moderator.
      SITE_MOD_PUBKEYS: "${SITE_MOD_PUBKEYS:-}"
      # Where `banned_pubkeys` is exported for the relay's write policy. Unset
      # disables the export; the path below is the shared `modlists` volume.
      BAN_LIST_EXPORT_PATH: "/strfry-plugin/banlist.json"
      # Invited pubkeys ("getting put on") — same volume, same hot-reload contract.
      INVITED_LIST_EXPORT_PATH: "/strfry-plugin/invited.json"
    volumes:
      # Shared named volume, read-WRITE here, read-only in strfry (mounted at
      # /app/dynamic). A named volume (not a bind of ./strfry) because deploys
      # re-extract the tree root-owned and this container runs as `node`; the
      # image pre-owns the mountpoint so the volume initialises node-writable.
      # A DIRECTORY mount also keeps the atomic write (write .tmp, rename over
      # the target) possible — renaming onto a bind-mounted single file is not.
      - modlists:/strfry-plugin
    networks: [oneinky]

  # Blossom-compatible media service (@1nky/media). Streams to R2.
  media:
    profiles: ["full"]
    build:
      context: ..
      dockerfile: infra/docker/media.Dockerfile
      args:
        PNPM_INSTALL_FLAGS: "${PNPM_INSTALL_FLAGS:---frozen-lockfile}"
    image: 1nky/media:local
    restart: unless-stopped
    environment:
      NODE_ENV: "${NODE_ENV:-production}"
      MEDIA_PORT: "3002"
      # Images: re-encoded with sharp, capped at MAX_UPLOAD_MB (default 5).
      MAX_UPLOAD_MB: "${MAX_UPLOAD_MB:-5}"
      # Videos: transcoded through ffmpeg with ALL metadata stripped, capped at
      # MAX_VIDEO_MB (default 50) input and 60s. Output is H.264 720p. The
      # media.Dockerfile installs ffmpeg in this image's runtime stage.
      MAX_VIDEO_MB: "${MAX_VIDEO_MB:-50}"
      MEDIA_PUBLIC_BASE: "${MEDIA_PUBLIC_BASE:-http://localhost/media}"
      R2_ACCOUNT_ID: "${R2_ACCOUNT_ID:-}"
      R2_ACCESS_KEY_ID: "${R2_ACCESS_KEY_ID:-}"
      R2_SECRET_ACCESS_KEY: "${R2_SECRET_ACCESS_KEY:-}"
      R2_BUCKET: "${R2_BUCKET:-1nky-media}"
      R2_ENDPOINT: "${R2_ENDPOINT:-}"
      # Optional recovery: stores ONLY passphrase-locked blackbook ciphertext
      # (NIP-49) keyed by pubkey. Unset/0 keeps all /escrow routes 404.
      ESCROW_ENABLED: "${ESCROW_ENABLED:-}"
      # Best-effort offsite blob redundancy via BUD-04 (e.g.
      # https://blossom.band). Unset disables the mirror worker.
      BLOSSOM_MIRROR_URL: "${BLOSSOM_MIRROR_URL:-}"
      BLOSSOM_MIRROR_CONCURRENCY: "${BLOSSOM_MIRROR_CONCURRENCY:-1}"
    expose:
      - "3002"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3002/healthz').then(function(r){process.exit(r.ok?0:1)}).catch(function(){process.exit(1)})"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [oneinky]

  # -------------------------------------------------------------------------
  # tor — .onion mirror of this origin (handoff item F, Phase 4).
  #
  # A single v3 onion service forwarding to caddy's plain-HTTP :8080 vhost. It
  # is the sovereign path: no Cloudflare, no CA, no DNS, and the box sees a Tor
  # circuit rather than a visitor. The clearnet vhosts are untouched by it.
  #
  # NO-LOGS: torrc sets `Log notice stderr` + `SafeLogging 1`. A hidden service
  # never learns a client address, and the per-circuit detail that would be
  # interesting to an attacker only appears at `info`, which torrc forbids.
  # tor's own *warnings* may name a Tor directory authority or relay by IP —
  # public infrastructure, never a 1NKY visitor. See infra/README.md.
  #
  # NO HOST PORTS, deliberately: nothing about this service should be reachable
  # except through the Tor network. Publishing a port here would create a second
  # unauthenticated way into caddy's plain-HTTP vhost.
  # -------------------------------------------------------------------------
  tor:
    profiles: ["full"]
    build:
      context: ./tor
      dockerfile: Dockerfile
    image: 1nky/tor:local
    restart: unless-stopped
    depends_on:
      caddy:
        condition: service_healthy
    volumes:
      # The hidden-service keys ARE the .onion address. Losing this volume
      # changes the address forever and kills every published link, so it is a
      # named volume that `docker compose down` (without -v) will not touch.
      - tor_keys:/var/lib/tor/onion
    healthcheck:
      # Two things, because two things can be wrong: the service has an address
      # (hostname file written => keys exist, HS published), and caddy is still
      # answering on :8080. The second half is what catches the one real gotcha
      # here — tor resolves `caddy` once at startup, so recreating the caddy
      # container leaves tor pointed at a stale address until it is restarted.
      test:
        - CMD-SHELL
        - test -s /var/lib/tor/onion/hostname && wget -q -O /dev/null http://caddy:8080/
      interval: 30s
      timeout: 10s
      retries: 5
      # Bootstrapping a circuit and publishing the descriptor takes a while.
      start_period: 90s
    networks: [oneinky]

  # -------------------------------------------------------------------------
  # backup — nightly pg_dump + strfry LMDB snapshot to the S3 bucket
  # (handoff item G, Phase 4). busybox crond; see backup/backup.sh.
  #
  # Reuses the existing R2_* credentials from infra/.env. No new secrets exist
  # for this service and none should be invented for it: it writes to a
  # `backups/` prefix in the same bucket the media service already owns.
  #
  # NO-LOGS: it accepts no connections, so it cannot log a request. backup.sh
  # prints object names and byte counts, and filters its own output for
  # IP-shaped strings as defence in depth.
  #
  # One-shot / restore drill:
  #     docker compose run --rm backup /backup.sh
  # -------------------------------------------------------------------------
  backup:
    profiles: ["full"]
    build:
      context: ./backup
      dockerfile: Dockerfile
    image: 1nky/backup:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "${DATABASE_URL:-postgres://oneinky:oneinky@postgres:5432/oneinky}"
      # The existing bucket credentials, unchanged. R2_* is a historical name:
      # an S3-compatible bucket; the specific provider comes from infra/.env.
      R2_ENDPOINT: "${R2_ENDPOINT:-}"
      R2_ACCESS_KEY_ID: "${R2_ACCESS_KEY_ID:-}"
      R2_SECRET_ACCESS_KEY: "${R2_SECRET_ACCESS_KEY:-}"
      R2_BUCKET: "${R2_BUCKET:-1nky-media}"
      # rclone's S3 provider profile, supplied from infra/.env (never the
      # bucket; set `Cloudflare` when the bucket moves to R2, `Other` for
      # anything else. Not a secret, so it is defaulted here rather than added
      # to the root .env.example (which infra/ may not edit).
      BACKUP_S3_PROVIDER: "${BACKUP_S3_PROVIDER:-Other}"
      # Usually unnecessary — the endpoint carries the region. Set it only if
      # the provider rejects the signature.
      BACKUP_S3_REGION: "${BACKUP_S3_REGION:-}"
      BACKUP_PREFIX: "${BACKUP_PREFIX:-backups}"
      BACKUP_RETAIN_DAYS: "${BACKUP_RETAIN_DAYS:-14}"
      # UTC. 09:10 is deep in the night for the seed cities and well clear of
      # the hour boundary every other cron on earth fires on.
      BACKUP_CRON: "${BACKUP_CRON:-10 9 * * *}"
      STRFRY_DB_DIR: "/strfry-db"
      BACKUP_STATE_DIR: "/var/lib/1nky-backup"
    volumes:
      # The relay's LMDB, READ-ONLY. This service must never be able to write to
      # the source of truth. Consequence: mdb_copy cannot open the environment
      # (it needs lock.mdb), so backup.sh tars the live directory — see the
      # tradeoff note in backup.sh and infra/README.md. To take consistent
      # snapshots instead, drop the `:ro` here and accept a writable mount.
      - strfry_db:/strfry-db:ro
      # The hidden-service keys ARE the published .onion address (see the tor
      # service). READ-ONLY, tiny, and the one artifact that can never be
      # regenerated — losing it retires a published link permanently, so it
      # rides along with every night's run.
      - tor_keys:/tor-keys:ro
      # Last-run status, so "are backups actually running?" has an answer that
      # is not "scroll the logs":
      #     docker compose exec backup cat /var/lib/1nky-backup/status
      - backup_state:/var/lib/1nky-backup
    healthcheck:
      # A dead crond is a silent backup outage, which is the only kind of
      # backup outage that matters.
      test: ["CMD-SHELL", "pgrep crond >/dev/null"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks: [oneinky]

networks:
  oneinky:
    driver: bridge

volumes:
  pgdata:
  strfry_db:
  caddy_data:
  caddy_config:
  # The .onion identity. Back this up out of band if the address matters (see
  # infra/README.md) — it is the one piece of state here that cannot be rebuilt.
  tor_keys:
  # Last-run status for the nightly backup. Disposable.
  backup_state:
  # Dynamic mod lists (ban/invited exports): indexer writes, strfry reads.
  # Disposable — the indexer re-exports on every startup.
  modlists:
